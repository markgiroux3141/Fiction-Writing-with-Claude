<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14120f">
<!-- An empty data: icon. The WebView asks for /favicon.ico on every load
     and logs a 404 when there is none, which is invisible in a fullscreen
     app and pure noise in the console the next bug gets debugged in. -->
<link rel="icon" href="data:,">
<title>Facsimile</title>
<link rel="stylesheet" href="app.css">

<!-- The shelf. Every book is found at runtime in the app's own folder on the
     device; nothing is bundled into the apk. -->
<div class="view" id="shelf">
  <header>
    <h1>Facsimile</h1>
    <p class="sub">a shelf of facsimiles</p>
  </header>
  <div id="books"></div>
</div>

<!-- The reader. One book at a time; the stage is rebuilt on each open,
     because page-flip's destroy() removes its own container. -->
<div class="view" id="reader">
  <div id="stage">
    <div id="book"></div>
    <div id="gutter"></div>
  </div>
</div>

<!-- The loupe. The layer swallows pointer events while it is up, so a page
     cannot turn under the glass; the lens is a circular window onto the page
     image at full resolution, and the glass itself sits over it. -->
<div id="loupeLayer">
  <div id="loupe">
    <div id="loupeLens"><img id="loupeImg" alt=""></div>
    <img id="loupeGlass" src="glass.png" alt="">
  </div>
</div>

<div id="chrome">
  <div id="bar">
    <button id="shelfBtn" title="Back to the shelf (Esc)">Shelf</button>
    <button id="prev">&larr;</button>
    <span id="folio"></span>
    <button id="next">&rarr;</button>
    <button id="glassBtn" title="Magnifier (M)">&#9906;</button>
    <button id="full" title="Fullscreen (F)">&#9974;</button>
  </div>
  <p id="hint">swipe, or drag a corner &nbsp;&middot;&nbsp; I inset &nbsp;&middot;&nbsp; F fullscreen &nbsp;&middot;&nbsp; B hides this</p>
</div>

<div id="opening">opening</div>

<script src="vendor/page-flip.browser.js"></script>
<script src="app.js"></script>
